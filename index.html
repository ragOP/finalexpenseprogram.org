        <script>
            (function(){
                let oParams = new URLSearchParams(window.location.search);
                let sParams = oParams.toString();

                if ((sParams != null) && (typeof sParams == "string") && ((sParams = sParams.trim()) != "")){
                    $(".add-url-params").each(function(){
                        let oElement = $(this);
                        let sHref = oElement.attr("href");
                        if ((sHref != null) && (typeof sHref == "string") && ((sHref = sHref.trim()) != "")){
                            oElement.attr("href", sHref + (sHref.includes("?") ? "&" : "?") + sParams);
                        }
                    });
                }

                $(".add-value-on-click").each(function(){
                    let oField = $(this);
                    let sHref = oField.attr("href");
                    let sFieldName = oField.data("field-name");
                    let sFieldValue = oField.data("field-value");

                    if (
                       (sHref != null) && (typeof sHref == "string") && ((sHref = sHref.trim()) != "") && 
                       (sFieldName != null) && (typeof sFieldName == "string") && ((sFieldName = sFieldName.trim()) != "") && 
                       (sFieldValue != null) && (((typeof sFieldValue == "string") && ((sFieldValue = sFieldValue.trim()) != "")) || (typeof sFieldValue == "number"))
                    ) {
                        oField.attr("href", "#");

                        oField.on("click", function(ev){
                            window.location.replace(sHref + (sHref.includes("?") ? "&" : "?") + sFieldName + "=" + sFieldValue);
                            ev.preventDefault();
                        });
                    }
                });
            })();
        </script>
